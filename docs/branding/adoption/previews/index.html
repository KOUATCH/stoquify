<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoquify · Brand adoption preview</title>
<style>
@font-face{font-family:Inter;src:url(assets/Inter-Variable.ttf)}@font-face{font-family:Manrope;src:url(assets/Manrope-Variable.ttf)}
:root{--bg:#102322;--surface:#193431;--raised:#23413C;--text:#F5F7F2;--muted:#B7CDC3;--border:#36524C;--control:#7A998C;--action:#A5E6D5;--on:#102322;--focus:#D6F36A;--warning:#FFD089;--warnbg:#44351C;--info:#ADCDFF;--infobg:#233853}
[data-theme=light]{--bg:#F5F7F2;--surface:#fff;--raised:#fff;--text:#142B2B;--muted:#526762;--border:#C9D4CE;--control:#70867E;--action:#087F72;--on:#fff;--focus:#087F72;--warning:#805000;--warnbg:#FFF1D6;--info:#245AA8;--infobg:#E8F0FC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,Arial,sans-serif}button,select,input{font:inherit}button,a,select{touch-action:manipulation}button,a{color:inherit}button{cursor:pointer}a{text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:4px}h1,h2,h3,strong{font-family:Manrope,Arial,sans-serif}h1,h2,h3,p{margin:0}button,.button,select{padding:10px 16px;border:1px solid var(--control);border-radius:8px;background:transparent;color:var(--text)}.primary{background:var(--action);color:var(--on);border-color:var(--action);font-weight:700}.muted{color:var(--muted)}.label{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.logo{width:158px;height:auto;display:block}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 28px;background:var(--surface);border-bottom:1px solid var(--border)}.toolbar strong{margin-right:auto}.toolbar label{display:flex;align-items:center;gap:7px;font-size:12px}.toolbar select{padding:7px;max-width:160px}.note{padding:12px 28px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 0}.public{max-width:1280px;margin:auto;padding:0 38px}.nav{display:flex;align-items:center;gap:23px;font-size:12px}.nav details{position:relative}.nav summary{cursor:pointer}.dropdown{position:absolute;z-index:5;width:210px;top:30px;padding:14px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--border);box-shadow:0 15px 30px #0003}.hero{display:grid;grid-template-columns:.82fr 1.18fr;gap:48px;align-items:center;padding:64px 0 72px}.hero h1{font-size:clamp(32px,3.5vw,50px);line-height:1.16;letter-spacing:-.04em;margin:20px 0}.hero h1 span{color:var(--action)}.hero p{color:var(--muted);font-size:15px;line-height:1.85}.badge{display:inline-block;border:1px solid var(--border);border-radius:30px;padding:6px 11px;font-size:10px;color:var(--muted)}.ctas{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.ctas a{font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:20px;border-top:1px solid var(--border)}.metrics strong{display:block;font-size:19px}.metrics small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.proof{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:10px;color:var(--muted)}.proof span:before{content:'✓ ';color:var(--action)}.controlroom{background:var(--surface);padding:25px;border:1px solid var(--border);border-radius:16px;box-shadow:0 25px 70px #0002}.panelhead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:24px}.panelhead h2{font-size:22px;line-height:1.35;margin-top:6px;letter-spacing:-.025em}.tiny{font-size:10px;padding:5px 8px;border-radius:6px;background:var(--raised);white-space:nowrap;color:var(--muted)}.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.status{border:1px solid var(--border);border-radius:9px;padding:16px}.status strong{font-size:22px;display:block;padding:5px 0}.status small{color:var(--muted);font-size:10px}.status .muted{font-size:11px}.warning{color:var(--warning)}.coverage{margin:22px 0}.coverage-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}.next{padding:15px;background:var(--warnbg);border-radius:9px;color:var(--warning)}.next p{font-size:12px;line-height:1.6;color:var(--warning);margin-top:4px}.feed{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:20px}.sections{border-top:1px solid var(--border);padding:36px 0 50px}.sections>p{margin-bottom:20px}.section-list{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.section-list article{padding:22px;background:var(--surface);border:1px solid var(--border);border-radius:10px;scroll-margin-top:20px}.section-list h3{font-size:15px;margin-top:8px}.section-list small{color:var(--muted)}footer{border-top:1px solid var(--border);padding:25px 0;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:900px}.sidebar{border-right:1px solid var(--border);padding:28px 22px;background:var(--surface)}.tenant{padding:18px 0 22px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:22px}.lane{margin-bottom:24px}.lane summary{list-style:none;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}.lane summary::after{content:'⌄';float:right}.sideitem{display:block;width:100%;text-align:left;padding:8px 10px;border:0;font-size:12px;margin:2px 0}.sideitem[aria-current]{background:var(--action);color:var(--on);font-weight:650}.topbar{height:75px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:0 30px;gap:10px;background:var(--surface)}.topbar .search{width:300px;text-align:left;color:var(--muted);font-size:12px}.identity{font-size:11px;color:var(--muted)}.dashboard{padding:32px;max-width:1450px;margin:auto}.dashhead{display:flex;justify-content:space-between;gap:20px;align-items:center}.dashhead h1{font-size:29px;line-height:1.3;margin:8px 0}.dashhead p{font-size:12px;color:var(--muted)}.dashhead button{font-size:12px}.brief{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px 24px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin:24px 0}.brief h3{font-size:17px;margin:7px 0}.brief p{font-size:12px;color:var(--muted)}.brief .sample{border-left:1px solid var(--border);padding-left:24px}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;margin:18px 0}.filters .spacer{flex:1}.filters select{font-size:12px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin:20px 0}.tabs button{border:0;border-radius:0;padding:11px 0;color:var(--muted)}.tabs button[aria-selected=true]{border-bottom:3px solid var(--action);color:var(--text)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kpi{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:18px}.kpi p{font-size:11px;color:var(--muted)}.kpi strong{font-size:30px;display:block;font-variant-numeric:tabular-nums;margin:10px 0}.kpi small{font-size:10px;color:var(--muted)}.dashpanels{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:20px}.dashpanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px}.dashpanel h2{font-size:16px}.emptychart{display:grid;place-items:center;min-height:160px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);background:repeating-linear-gradient(0deg,transparent,transparent 39px,var(--border) 40px)}.emptychart span{background:var(--surface);padding:8px}.legend{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.legend span{font-size:10px;padding:4px 9px;border-radius:5px;background:var(--raised)}.legend .warn{background:var(--warnbg);color:var(--warning)}.legend .info{background:var(--infobg);color:var(--info)}.mobilemenu{display:none}.proposal-note{font-size:11px;color:var(--muted);margin:24px 0}.toast{position:fixed;bottom:20px;right:20px;padding:14px 22px;background:var(--action);color:var(--on);border-radius:10px;max-width:80vw;z-index:30}.hidden{display:none!important}
@media(max-width:1100px){.nav{gap:12px}.nav .secondarynav{display:none}.hero{gap:26px}.public{padding:0 25px}.shell{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:25px 16px}.dashboard{padding:25px}.panelhead{flex-direction:column}.dashhead{align-items:flex-start}.dashhead button{white-space:nowrap}}
@media(max-width:760px){.toolbar{padding:12px 16px;gap:9px}.toolbar strong{flex-basis:100%;font-size:13px}.toolbar label{font-size:11px}.toolbar select{font-size:11px;max-width:132px}.note{padding:10px 16px}.public{padding:0 20px}.logo{width:135px}header{padding:22px 0}.nav>.lead,.nav>.login{display:none}.nav{gap:10px}.nav .primary{padding:8px 10px;font-size:11px}.hero{display:block;padding:24px 0 35px}.hero h1{font-size:38px}.hero p{font-size:14px}.controlroom{margin-top:35px;padding:19px}.panelhead{flex-direction:row}.panelhead h2{font-size:19px}.panelhead .tiny{white-space:normal;font-size:9px;max-width:85px}.section-list{grid-template-columns:1fr}.shell{display:block;min-height:1000px}.sidebar{display:none}.shell.menu-open .sidebar{display:block;border-bottom:1px solid var(--border)}.mobilemenu{display:inline-block}.topbar{padding:12px 16px;height:auto}.topbar .search{width:auto;flex:1}.identity{display:none}.dashboard{padding:22px 16px}.dashhead{display:block}.dashhead h1{font-size:26px}.dashhead button{margin-top:16px}.brief{grid-template-columns:1fr;padding:18px}.brief .sample{border-left:0;border-top:1px solid var(--border);padding:14px 0 0}.filters .spacer{display:none}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:14px}.dashpanels{grid-template-columns:1fr}.tabs{gap:22px}.tabs button{font-size:13px}footer{gap:20px}.dropdown{right:0}.status{padding:12px}}
</style></head><body>
<div class="toolbar"><strong>Stoquify / Brand adoption study</strong><label>Surface <select id="surface"><option value="landing">Landing page</option><option value="shell">Application shell</option></select></label><label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light proposal</option></select></label><label>Language <select id="language"><option value="en">English</option><option value="fr">Français</option></select></label></div>
<div class="note" id="note"></div><main id="preview"></main><div class="toast hidden" id="toast" role="status"></div><script src="content.js"></script>
<script>
const $=s=>document.querySelector(s);let lang='en',surface='landing',theme='dark';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=(a,b)=>lang==='fr'?b:a;const logo=()=>`<img class="logo" src="assets/stoquify-horizontal-${theme==='dark'?'reversed':'color'}.svg" alt="Stoquify">`;const btn=(label)=>`<button type="button" data-demo>${esc(label)}</button>`;
function render(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;const l=STOQUIFY_CONTENT[lang].landing,d=STOQUIFY_CONTENT[lang].dashboard;$('#note').textContent=t('Design proposal · Source-based structure, not a live application. Dashes represent omitted business data. Light shell support requires a separate implementation pass.','Proposition graphique · Structure issue du code, sans connexion à l’application. Les tirets remplacent les données métier. Le thème clair du tableau de bord demande une adaptation dédiée.');
if(surface==='landing'){
const links=[['product','product'],['workflow','workflow'],['platform','modules'],['people','people-to-pay'],['controls','daily-control'],['automation','automation'],['trust','trust'],['useCases','use-cases'],['pricing','pricing']];
const nav=(a)=>a.map(([key,id])=>`<a href="#${id}">${esc(l.header[key])}</a>`).join('');
const sec=[['problem',l.problem.title,'DisconnectProblem'],['product',l.gallery.title,'ProductGallery'],['workflow',l.workflow.title,'ConnectedWorkflow'],['modules',l.operations.title,'OperationsMap'],['people-to-pay',l.header.people,'PeopleToPay'],['daily-control',l.deepDives.title,'ModuleDeepDives'],['automation',l.automation.title,'AutomationSection'],['trust',l.trust.title,'TrustSection'],['use-cases',l.useCases.title,'UseCases'],['pricing',l.header.pricing,'PricingSection'],['final',l.hero.primaryCta,'FinalCTA']];
$('#preview').innerHTML=`<div class="public"><header><a href="#" aria-label="${esc(l.header.homeAria)}">${logo()}</a><nav class="nav" aria-label="${esc(l.header.navAria)}"><span class="lead nav">${nav(links.slice(0,3))}</span><details><summary>${esc(l.header.explore)}</summary><div class="dropdown">${nav(links.slice(3))}<a href="#workflow">${esc(l.header.workflowAtlas)} · ${t('preview','aperçu')}</a></div></details><a class="login" href="#" data-demo>${esc(l.header.login)}</a><a class="button primary" href="#pricing">${esc(l.header.startFree)}</a></nav></header><section class="hero"><div><span class="badge">${esc(l.hero.badge)}</span><h1>${esc(l.hero.titleStart)} <span>${esc(l.hero.titleEmphasis)}</span></h1><p>${esc(l.hero.description)}</p><div class="ctas"><a class="button primary" href="#pricing">${esc(l.hero.primaryCta)} ↗</a><a class="button" href="#product">${esc(l.hero.secondaryCta)}</a></div><div class="metrics">${Object.values(l.hero.metrics).map(m=>`<div><strong>${esc(m.value)}</strong><small>${esc(m.label)}</small></div>`).join('')}</div><div class="proof">${Object.values(l.hero.proof.items).map(s=>`<span>${esc(s)}</span>`).join('')}</div></div><div class="controlroom"><div class="panelhead"><div><div class="label">${esc(l.dashboard.period)}</div><h2>${esc(l.dashboard.title)}</h2></div><span class="tiny">${t('Layout only','Maquette visuelle')}</span></div><div class="statusgrid">${Object.values(l.dashboard.rows).map((r,i)=>`<div class="status"><span class="muted">${esc(r.label)}</span><strong class="${i===1?'warning':''}">—</strong><small>${esc(r.meta)}</small></div>`).join('')}</div><div class="coverage"><div class="label">${esc(l.dashboard.inventoryHealth)}</div>${Object.values(l.dashboard.branches).map(s=>`<div class="coverage-row"><span>${esc(s)}</span><span>—</span></div>`).join('')}</div><div class="next"><div class="label" style="color:inherit">${esc(l.dashboard.nextActionLabel)} · ${t('sample copy','texte d’exemple')}</div><p>${esc(l.dashboard.nextAction)}</p></div><div class="feed"><span>${esc(l.dashboard.liveFeed)}</span><span>—</span></div></div></section><section class="sections"><p class="label">${t('Existing sections · condensed layout index','Sections existantes · index condensé')}</p><div class="section-list">${sec.map(([id,title,file],i)=>`<article id="${id}"><small>${String(i+2).padStart(2,'0')} / ${file}</small><h3>${esc(title)}</h3></article>`).join('')}</div></section><footer>${logo()}<span>${t('Structural preview · no live forms or accounts','Maquette de structure · aucun formulaire ou compte actif')}</span></footer></div>`;
}else{
const groups=lang==='en'?[['Command',['Dashboard','Daily digest','Manager Action Center']],['Operations',['Inventory','Sales','Purchasing','Point of sale']],['Finance & Trust',['Accounting','Reconciliation','Close assurance']],['People',['People','Payroll']],['Governance',['Settings','Modules']]]:[['Pilotage',['Tableau de bord','Synthèse quotidienne','Centre d’actions']],['Opérations',['Stock','Ventes','Achats','Point de vente']],['Finance et confiance',['Comptabilité','Rapprochement','Clôture']],['Personnel',['Personnel','Paie']],['Gouvernance',['Paramètres','Modules']]];
$('#preview').innerHTML=`<div class="shell"><aside class="sidebar">${logo()}<div class="tenant">${t('Organization from session','Organisation de la session')}<br><small>${t('Role and scope retained','Rôle et périmètre conservés')}</small></div>${groups.map(([title,items],i)=>`<details class="lane" open><summary>${esc(title)}</summary>${items.map((s,j)=>`<button class="sideitem" ${i===0&&j===0?'aria-current="page"':''} data-demo>${esc(s)}</button>`).join('')}</details>`).join('')}<p class="proposal-note">${t('Representative links only. Production visibility remains permission- and module-filtered. Sidebar translations here are illustrative.','Liens représentatifs. En production, les droits et modules filtrent la navigation. Traductions de la barre latérale illustratives.')}</p></aside><div><div class="topbar"><button class="mobilemenu" id="mobile" aria-label="${t('Toggle preview navigation','Afficher la navigation')}" aria-expanded="false">☰</button><button class="search" data-demo>⌕ &nbsp; ${t('Search navigation','Rechercher dans la navigation')}</button><span class="identity">${t('Session role / organization','Rôle / organisation de la session')}</span><button data-demo aria-label="${t('Account preview','Aperçu du compte')}">◯</button></div><div class="dashboard"><div class="dashhead"><div><div class="label">${t('Command / Overview','Pilotage / Vue d’ensemble')}</div><h1>${esc(d.title)}</h1><p>${t('Layout preview • no operating data connected','Maquette visuelle • aucune donnée opérationnelle connectée')}</p></div><button class="primary" data-demo>↻ ${esc(d.refresh)}</button></div><div class="brief"><div><div class="label">${t('Operating truth','Situation opérationnelle')}</div><h3>${t('Your current operating scope','Votre périmètre opérationnel')}</h3><p>${t('The existing command brief and action regions retain their place.','Le résumé opérationnel et les actions conservent leur emplacement.')}</p></div><div class="sample"><div class="label">${esc(d.sections.pendingActions)}</div><h3>—</h3><p>${t('Server-owned state and evidence remain unchanged.','Les états et preuves restent définis par le serveur.')}</p></div></div><div class="filters"><span>${esc(d.filters.period)}</span><select aria-label="${esc(d.filters.period)}">${Object.values(d.periods).map(x=>`<option>${esc(x)}</option>`).join('')}</select><span class="spacer"></span><span>${esc(d.filters.location)}</span><select aria-label="${esc(d.filters.location)}"><option>${esc(d.allLocations)}</option></select></div><div class="tabs" role="tablist">${Object.values(d.tabs).map((v,i)=>`<button role="tab" aria-selected="${i===0}" data-tab>${esc(v)}</button>`).join('')}</div><div class="kpis">${Object.entries(d.metrics).map(([k,v])=>`<article class="kpi"><p>${esc(v)}</p><strong>—</strong><small>${esc(d.metricDescriptions[k])}</small></article>`).join('')}</div><div class="dashpanels"><section class="dashpanel"><h2>${esc(d.sections.salesTrend)}</h2><div class="emptychart"><span>${t('No fabricated chart series','Aucune série de données fictive')}</span></div><p class="proposal-note">${esc(d.sections.salesTrendDescription)}</p></section><section class="dashpanel"><h2>${esc(d.sections.stockHealth)}</h2>${['trackedItems','lowStock','outOfStock'].map(k=>`<div class="coverage-row"><span>${esc(d.stock[k])}</span><span>—</span></div>`).join('')}<div class="legend"><span class="warn">${t('Warning','Avertissement')}</span><span class="info">${t('Information','Information')}</span></div></section></div><p class="proposal-note">${t('Brand proposal: shared solid S, Manrope / Inter, teal actions and restrained surfaces. Amber and red keep their operational meanings.','Proposition : S plein partagé, Manrope / Inter, actions vert sarcelle et surfaces sobres. L’ambre et le rouge conservent leur sens opérationnel.')}</p></div></div></div>`;
$('#mobile').onclick=()=>{const open=$('.shell').classList.toggle('menu-open');$('#mobile').setAttribute('aria-expanded',open)};
}
document.querySelectorAll('[data-demo],[data-tab]').forEach(el=>el.onclick=e=>{e.preventDefault();$('#toast').textContent=t('Presentation preview only; no business action is performed.','Maquette visuelle uniquement ; aucune action métier exécutée.');$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500)});
}
['surface','theme','language'].forEach(id=>$('#'+id).onchange=()=>{surface=$('#surface').value;theme=$('#theme').value;lang=$('#language').value;render()});render();
</script></body></html>
