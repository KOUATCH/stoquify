name: Stoquify Release Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: stoquify-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Repo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqstoqflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aqstoqflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/aqstoqflow_ci?schema=public"
      PAYROLL_IMMUTABILITY_DATABASE_URL: "postgresql://ci:ci@localhost:5432/stockflow_immutability_test?schema=public"
      PGPASSWORD: ci
      AUTH_SECRET: "ci-only-auth-secret-32-characters-minimum-value"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Isolated Payroll Test Database
        run: >-
          psql --host localhost --username ci --dbname aqstoqflow_ci
          --set ON_ERROR_STOP=1
          --command 'CREATE DATABASE stockflow_immutability_test;'

      - name: Run CI Verification
        run: npm run verify:ci
