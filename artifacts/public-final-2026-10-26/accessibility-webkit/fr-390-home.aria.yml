    - article:
      - figure "DES OPÉRATIONS AUX JUSTIFICATIFS DE PAIEMENT.":
        - 'img "Scène illustrative : une négociante en matériaux examine une livraison avec un client, à côté d’un ordinateur tout-en-un affichant le rapprochement Stoquify"'
        - text: DES OPÉRATIONS AUX JUSTIFICATIFS DE PAIEMENT.
        - button "Voir l’écran Stoquify · Revue des paiements"
      - paragraph: 02 / RAPPROCHEZ LES PAIEMENTS
      - heading "Sachez ce qui a été payé. Expliquez les écarts." [level=2]
      - paragraph: Un paiement enregistré ne suffit pas à lui seul. Comparez-le aux relevés importés ou aux justificatifs des prestataires pris en charge, examinez les éléments non rapprochés et conservez chaque décision.
      - text: Paiement enregistré Justificatif Les écarts restent visibles jusqu’à leur examen.
      - link "Explorer le rapprochement":
