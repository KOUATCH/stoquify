    - article:
      - heading "Tenez des comptes structurés." [level=3]
      - paragraph: Utilisez les références SYSCOHADA, les règles de comptabilisation configurées, les journaux et le grand livre. Remontez d’une écriture à l’opération et aux justificatifs qui l’expliquent.
      - group: Découvrir les données comptables
    - article:
      - heading "Identifiez ce qui reste à traiter avant la clôture." [level=3]
      - paragraph: Examinez les écarts de rapprochement, les justificatifs manquants et les points de clôture. Gardez les responsabilités et la revue du comptable visibles avant de déclarer la période prête.
      - group: Découvrir les contrôles de clôture
    - link "Explorer la comptabilité et la clôture":
      - /url: /fr/workflows#workflow-accountingCloseAssurance
    - paragraph: La comptabilité dépend des paramètres et données d’origine vérifiés. Les rapports internes ne constituent pas des états réglementaires certifiés.
