    - article "Votre cabinet part des données déjà présentes.":
      - figure "VOTRE ENTREPRISE. VOTRE CABINET. UNE REVUE PARTAGÉE.":
        - img "Cabinet comptable illustratif examinant les données clients sur un grand écran Stoquify tourné vers le visiteur"
        - text: VOTRE ENTREPRISE. VOTRE CABINET. UNE REVUE PARTAGÉE.
        - button "Voir l’écran Stoquify · Revue comptable client"
      - paragraph: COLLABOREZ AVEC VOTRE CABINET COMPTABLE
      - heading "Votre cabinet part des données déjà présentes." [level=2]
      - paragraph: Ventes, factures clients, mouvements de stock et calculs de paie constituent une trace de votre activité dans Stoquify. Grâce aux comptabilisations configurées et aux liens sources, votre cabinet autorisé peut examiner le grand livre et les justificatifs derrière ses chiffres.
      - group: Une revue utile à l’entreprise et au cabinet
      - link "Explorer le parcours de revue comptable":
        - /url: /fr/workflows#workflow-accountingCloseAssurance
      - paragraph: Pour collaborer, un utilisateur autorisé de l’espace client peut inviter un comptable. L’invitation des nouveaux comptables comprend un lien d’inscription ; les utilisateurs existants peuvent recevoir un accès délimité. Chaque client contrôle l’accès à ses données.
      - group "Parcours du cabinet comptable":
        - article:
          - text: 01 / Mandat client
          - heading "Inviter, accepter et délimiter l’accès" [level=3]
          - paragraph: Chaque client définit son périmètre, avec expiration et révocation.
        - article:
          - text: 02 / Portefeuille clients
          - heading "Choisir le client et la période" [level=3]
          - paragraph: Retrouvez les clients autorisés et le contexte de revue pertinent.
        - article:
          - text: 03 / Dossier de revue
          - heading "Examiner, suivre et conserver les conclusions" [level=3]
          - paragraph: Reliez écritures et pièces, traitez les anomalies et vérifiez les exports autorisés.
    - paragraph: 03 / TENEZ LES COMPTES. 04 / PRÉPAREZ LA CLÔTURE.
    - heading "Comptabilité OHADA. Une clôture mieux préparée." [level=2]
    - paragraph: Votre cabinet examine la période à partir des écritures comptabilisées, liens sources et contrôles déjà disponibles dans Stoquify.
