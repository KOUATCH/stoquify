        - button "Voir l’écran Stoquify · Stocks et ventes"
      - paragraph: 01 / PILOTEZ L’ACTIVITÉ
      - heading "Gardez la vente reliée au stock." [level=2]
      - paragraph: Au comptoir, chaque reçu et chaque quantité comptent. Enregistrez les ventes en caisse, suivez les mouvements de stock par site et retrouvez l’origine de chaque changement.
