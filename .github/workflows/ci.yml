name: Stoquify Release Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: stoquify-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-workflow:
    name: Agent Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate Workflow Contract Before Installing Dependencies
        run: node scripts/verify-agent-workflow-contract.js
      - name: Install Dependencies
        run: npm ci
      - name: Test Workflow Contract
        run: npm run agent:workflow:test
      - name: Generate Prisma Client for Mocked Pilots
        # Generates code only; no database service, migrations or seed in this job.
        env:
          DATABASE_URL: "postgresql://unused:unused@127.0.0.1:1/unused"
        run: node node_modules/prisma/build/index.js generate
      - name: Run Bounded Unit and Component Pilots
        run: npm run test:ecc:pilots

      - name: Verify Artifact and Schema Promotion Boundary
        # Filesystem/mocked orchestration only; never promotes a schema.
        run: >-
          node node_modules/jest/bin/jest.js --config jest.s10-s11.config.cjs --runInBand
          --runTestsByPath tests/s10-s11/release-artifact.test.js
          scripts/__tests__/prisma-production-migration-gate.test.js
          scripts/__tests__/ci-release-readiness-gate.test.js

  verify:
    name: Verify Repo
    needs: agent-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqstoqflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aqstoqflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/aqstoqflow_ci?schema=public"
      PAYROLL_IMMUTABILITY_DATABASE_URL: "postgresql://ci:ci@localhost:5432/stockflow_immutability_test?schema=public"
      PGPASSWORD: ci
      AUTH_SECRET: "ci-only-auth-secret-32-characters-minimum-value"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Isolated Payroll Test Database
        run: >-
          psql --host localhost --username ci --dbname aqstoqflow_ci
          --set ON_ERROR_STOP=1
          --command 'CREATE DATABASE stockflow_immutability_test;'

      - name: Run CI Verification
        run: npm run verify:ci

  close-assurance-smoke:
    name: Close Assurance Browser Smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqstoqflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aqstoqflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/aqstoqflow_ci?schema=public"
      PGPASSWORD: ci
      AUTH_SECRET: "ci-only-auth-secret-32-characters-minimum-value"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Close Assurance Browser Smoke
        run: npm run test:e2e:close-assurance

  command-agent-enabled-pilot:
    name: Command Agent Enabled Pilot Certification
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqstoqflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aqstoqflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/aqstoqflow_ci?schema=public"
      PGPASSWORD: ci
      AUTH_SECRET: "ci-only-auth-secret-32-characters-minimum-value"
      NEXTAUTH_URL: "http://localhost:3107"
      NEXT_PUBLIC_APP_URL: "http://localhost:3107"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      PLAYWRIGHT_PORT: "3107"
      AQSTOQFLOW_E2E_ORG_ID: "org_payroll_e2e_local"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Governed Enabled-Pilot Certification
        run: npm run test:e2e:command-agent:enabled

      - name: Upload Certification Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-agent-enabled-pilot-evidence
          path: |
            what-next/agents-runtime/command-agent-enabled-playwright.json
            what-next/agents-runtime/command-agent-enabled-e2e-state.json
            test-results/
            playwright-report/
          if-no-files-found: warn
